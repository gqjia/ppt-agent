<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <title>单页面HTML PPT示例</title>
  <link href="https://cdn.tailwindcss.com/" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <style>
    body {
      @apply bg-gray-100;

    }
  </style>
</head>
<body>

</html>
