<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单页面HTML PPT</title>
    <link href="https://cdn.tailwindcss.com" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        .ppt-container {
            max-width: 800px;
            width: 100%;
            padding: 2rem;
            background-color: white;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
        }
        .ppt-title {
            font-size: 2rem;
            color: #333;
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .ppt-subtitle {
            font-size: 1.2rem;
            color: #666;
            text-align: center;
            margin-bottom: 2rem;
        }
        .ppt-content {
            line-height: 1.6;
        }
        .ppt-content h2 {
            font-size: 1.5rem;
            color: #333;
            margin-top: 1.5rem;
            margin-bottom: 1rem;
        }
        .ppt-content p {
            font-size: 1rem;
            color: #666;
            margin-bottom: 1rem;
        }
        .ppt-content ul,
        .ppt-content ol {
            margin-left: 1.5rem;
            margin-bottom: 1rem;
        }
        .ppt-content li {
            font-size: 1rem;
            color: #666;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="ppt-container">
        <h1 class="ppt-title">示例PPT标题</h1>
        <h2 class="ppt-subtitle">副标题</h2>
        <div class="ppt-content">
            <p>这是示例PPT的内容。如果您提供了一个有效的Markdown文件，我将能够读取并总结其中的内容。</p>
            <h2>主要内容</h2>
            <ul>
                <li>要点1</li>
                <li>要点2</li>
                <li>要点3</li>
            </ul>
            <h2>结论</h2>
            <p>这是示例PPT的结论部分。请提供一个有效的Markdown文件以生成实际内容。</p>
        </div>
    </div>
</body>
</html>
