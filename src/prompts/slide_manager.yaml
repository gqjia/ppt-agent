final_answer:
  pre_messages: |-
    一个智能体尝试回答用户问题但遇到困难并失败了。现在你需要代替它提供答案。以下是该智能体的记忆：

  post_messages: |-
    请基于之前的信息，为任务"{{task}}"生成完整的幻灯片管理结果，按照要求在final_answer中输出完整的HTML页面内容。
    输出格式：
    ```json
    {
      "name": "final_answer",
      "arguments": {
        "answer": "页面1: [HTML 页面内容]\n页面2: [HTML 页面内容]\n..."
      }
    }
    ```