final_answer:
  pre_messages: |-
    一个代理试图生成PPT内容但遇到问题。基于以下信息提供内容：

  post_messages: |-
    请基于上述搜索信息，为以下主题生成完整的中文PPT章节内容：
    {{task}}

    最终输出应该是：
    ```json
